<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal OS | Joystick Controlled</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div id="desktop">
        <!-- Icons -->
        <div class="icon" data-name="System" style="top: 20px; left: 20px;">
            <div class="icon-box"></div>
            <span>System Status</span>
        </div>
        
        <div class="icon" data-name="HaptiKit AI" style="top: 120px; left: 20px;">
            <div class="icon-box highlight"></div>
            <span>HaptiKit AI</span>
        </div>

        <div class="icon" data-name="ASL" style="top: 220px; left: 20px;">
            <div class="icon-box asl"></div>
            <span>ASL Translate</span>
        </div>

        <div class="icon" data-name="Trash" style="top: 20px; left: 120px;">
            <div class="icon-box gray-icon"></div>
            <span>Trash</span>
        </div>

        <!-- Windows -->
        
        <!-- System Status Window -->
        <div id="system-window" class="window" style="display: none; top: 100px; left: 250px;">
            <div class="window-header">
                <span>System Status</span>
                <button class="close-btn">X</button>
            </div>
            <div class="window-body">
                <p>Sensor: <span id="dist-val">--</span> cm</p>
                <p>Joystick: <span id="joy-val">0, 0</span></p>
            </div>
        </div>

        <!-- HaptiKit AI Window -->
        <div id="haptikit-ai-window" class="window" style="display: none; top: 120px; left: 270px;">
            <div class="window-header">
                <span>HaptiKit AI</span>
                <button class="close-btn">X</button>
            </div>
            <div class="window-body">
                <p class="ai-status">AI ENGINE: ONLINE</p>
                <p>Detected: <span id="objects-val">Nothing</span></p>
                <div class="video-preview">
                    <img src="{{ url_for('video_feed') }}" width="100%">
                </div>
            </div>
        </div>

        <!-- ASL Window -->
        <div id="asl-window" class="window" style="display: none; top: 140px; left: 290px;">
            <div class="window-header">
                <span>ASL Translator</span>
                <button class="close-btn">X</button>
            </div>
            <div class="window-body">
                <p>Translating live movements...</p>
                <div class="video-preview">
                     <img src="{{ url_for('video_feed') }}" width="100%" style="filter: grayscale(100%) contrast(150%);">
                </div>
                <p class="asl-output">Prediction: <span id="asl-pred">Waiting...</span></p>
            </div>
        </div>

        <!-- Trash Window -->
        <div id="trash-window" class="window" style="display: none; top: 160px; left: 310px;">
            <div class="window-header">
                <span>Recycle Bin</span>
                <button class="close-btn">X</button>
            </div>
            <div class="window-body">
                <p>The bin is empty.</p>
                <p>Just like my thoughts.</p>
            </div>
        </div>

        <!-- Taskbar -->
        <div id="taskbar">
            <button id="start-btn">Start</button>
            <div id="clock">12:00 PM</div>
        </div>

        <!-- Custom Cursor -->
        <div id="cursor"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
